[project]
name = "resync"
version = "0.1.0"
description = "Production→lower-environment Oracle database re-sync: natural-identity merge with foreign-key remapping."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Eliezio Oliveira", email = "eliezio.oliveira@gmail.com" }]
keywords = ["oracle", "database", "data-migration", "etl", "database-refresh"]
dependencies = [
  "oracledb>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
integration = ["pytest>=8", "testcontainers[oracle]>=4.0"]

[project.scripts]
resync = "resync_engine.cli:main"

[project.urls]
Homepage = "https://github.com/eliezio/resync"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resync_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
