, sans-serif" font-size="10.5" fill="#3c444d" text-anchor="start" font-weight="normal" >created on DEV</text><rect x="622" y="147" width="236" height="32" rx="5" fill="#cfe3f7" stroke="#2e6da4" stroke-width="1.5"/><text x="632" y="160.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#123a5e" text-anchor="start" font-weight="normal" >7001  SO-1001</text><text x="632" y="175.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#123a5e" text-anchor="start" font-weight="normal" >key kept, columns updated</text><rect x="622" y="195" width="236" height="32" rx="5" fill="#d8f0d8" stroke="#3d8b3d" stroke-width="1.5"/><text x="632" y="208.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1d4f1d" text-anchor="start" font-weight="normal" >9012  SO-1002</text><text x="632" y="223.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1d4f1d" text-anchor="start" font-weight="normal" >new key from ORDER_SEQ.NEXTVAL</text><rect x="622" y="243" width="236" height="32" rx="5" fill="#f1f2f4" stroke="#98a2ad" stroke-width="1.5" stroke-dasharray="5 3"/><text x="632" y="256.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#3c444d" text-anchor="start" font-weight="normal" >8003  SO-9999</text><text x="632" y="271.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3c444d" text-anchor="start" font-weight="normal" >preserved</text><line x1="296" y1="190" x2="314" y2="190" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/><text x="305.0" y="83" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle" font-weight="600" >match on ORDER_NO</text><line x1="586" y